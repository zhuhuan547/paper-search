# 默认配置文件 — search-runner 生成临时 config 时的骨架
# 用户通过 /search-request 输入需求，自动覆盖对应字段

search:
  keywords: []
  year_range:
  - 2021
  - 2026
  max_papers: 10
  max_search_pages: 5
  sources:
  - semantic_scholar
  - dblp
  - arxiv
  expand_synonyms: true

venue:
  min_ccf_level: null
  include_patterns: []
  exclude_patterns: []
  allow_arxiv_only: true

modules:
  include: []
  exclude: []
  match_mode: semantic

datasets:
  include: []
  exclude: []

code:
  require_open_source: false
  min_stars: 0
  platforms:
  - github
  - gitlab
  min_code_files: 1

output:
  formats:
  - markdown
  - csv
  - bibtex
  path: ./output/search_result
  include_reasoning: true

cache:
  enabled: true
  path: ./cache
  ttl_hours: 168
